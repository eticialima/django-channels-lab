{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-headset"></i> Support Admin Dashboard
            </span>
            <span class="navbar-text text-light">
                Admin
            </span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-lg-12">
                <h2 class="mb-4">Active Clients</h2>

                <div id="clientsList" class="row">
                    <!-- Clients will be populated here -->
                </div>

                <div id="noClientsMessage" class="alert alert-info" style="display: none;">
                    <i class="bi bi-info-circle"></i> No active clients at the moment.
                </div>
            </div>
        </div>
    </div>

    <script>
        class AdminDashboard {
            constructor() {
                this.socket = null;
                this.clientsList = document.getElementById('clientsList');
                this.noClientsMessage = document.getElementById('noClientsMessage');
                this.clients = {};

                this.connectWebSocket();
            }

            connectWebSocket() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const url = `${protocol}//${window.location.host}/ws/support/admin/`;

                this.socket = new WebSocket(url);
                this.socket.onopen = () => this.onOpen();
                this.socket.onmessage = (event) => this.onMessage(event);
                this.socket.onclose = () => this.onClose();
                this.socket.onerror = (error) => this.onError(error);
            }

            onOpen() {
                console.log('Admin connected');
                // Request list of active clients
                this.socket.send(JSON.stringify({
                    type: 'admin_get_clients',
                }));
            }

            onMessage(event) {
                const data = JSON.parse(event.data);

                switch (data.type) {
                    case 'clients_list':
                        this.updateClientsList(data.clients);
                        break;
                    case 'new_client_joined':
                        this.addClient(data.client_id, data.client_name);
                        break;
                    case 'client_disconnected':
                        this.removeClient(data.client_id);
                        break;
                    default:
                        console.warn('Unknown message type:', data.type);
                }
            }

            onClose() {
                console.log('Admin disconnected');
            }

            onError(error) {
                console.error('WebSocket error:', error);
            }

            updateClientsList(clients) {
                this.clientsList.innerHTML = '';
                this.clients = {};

                if (clients.length === 0) {
                    this.noClientsMessage.style.display = 'block';
                } else {
                    this.noClientsMessage.style.display = 'none';
                    clients.forEach(client => {
                        this.addClientCard(client.id, client.name, client.connected_at);
                    });
                }
            }

            addClient(clientId, clientName) {
                if (!this.clients[clientId]) {
                    this.clients[clientId] = { name: clientName };
                    this.addClientCard(clientId, clientName, new Date().toISOString());
                    this.noClientsMessage.style.display = 'none';
                }
            }

            addClientCard(clientId, clientName, connectedAt) {
                const colDiv = document.createElement('div');
                colDiv.className = 'col-md-6 col-lg-4 mb-3';
                colDiv.id = `client-${clientId}`;

                const date = new Date(connectedAt);
                const timeStr = date.toLocaleTimeString();

                colDiv.innerHTML = `
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-body">
                            <h6 class="card-title text-truncate">
                                <i class="bi bi-person-circle"></i> ${this.escapeHtml(clientName)}
                            </h6>
                            <small class="text-muted d-block mb-3">
                                Connected: ${timeStr}
                            </small>
                            <a href="/support/admin/${clientId}/" class="btn btn-primary btn-sm w-100">
                                <i class="bi bi-chat-dots"></i> Open Chat
                            </a>
                        </div>
                    </div>
                `;

                this.clientsList.appendChild(colDiv);
            }

            removeClient(clientId) {
                const clientEl = document.getElementById(`client-${clientId}`);
                if (clientEl) {
                    clientEl.remove();
                    delete this.clients[clientId];
                }

                if (Object.keys(this.clients).length === 0) {
                    this.noClientsMessage.style.display = 'block';
                }
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Initialize
        const admin = new AdminDashboard();
    </script>
</body>
</html>
