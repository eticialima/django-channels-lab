{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Support Chat</span>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Login Section -->
                <div id="loginSection" class="card shadow mb-4">
                    <div class="card-body">
                        <h4 class="card-title text-center mb-4">Enter Support Chat</h4>
                        
                        <!-- Reconnect option if previous session exists -->
                        <div id="reconnectOption" style="display: none;" class="alert alert-info mb-3">
                            <p class="mb-2">
                                <i class="bi bi-info-circle"></i> 
                                You have a previous support chat session. Would you like to continue it?
                            </p>
                            <button type="button" class="btn btn-sm btn-info" id="reconnectBtn">
                                Reconnect to Previous Chat
                            </button>
                            <button type="button" class="btn btn-sm btn-secondary" id="newChatBtn">
                                Start New Chat
                            </button>
                        </div>
                        
                        <form id="usernameForm">
                            <div class="mb-3">
                                <label for="usernameInput" class="form-label">Your Name:</label>
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="usernameInput" 
                                    placeholder="Enter your name"
                                    required
                                    autofocus
                                >
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                Start Support Chat
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Chat Section (hidden until connected) -->
                <div id="chatSection" class="card shadow" style="display: none;">
                    <div class="card-header bg-primary text-white">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Support Chat</h5>
                            <span id="connectionStatus" class="badge bg-danger">Disconnected</span>
                        </div>
                    </div>
                    
                    <div class="card-body">
                        <div class="alert alert-info">
                            <strong>You are in queue.</strong> An admin will respond shortly...
                        </div>

                        <div id="chatMessages" class="chat-messages">
                            <!-- Messages will appear here -->
                        </div>
                    </div>

                    <div class="card-footer bg-light">
                        <form id="messageForm" class="d-flex gap-2">
                            <input 
                                type="text" 
                                id="messageInput" 
                                class="form-control rounded-pill" 
                                placeholder="Type your message..."
                                disabled
                            >
                            <button 
                                type="submit" 
                                class="btn btn-primary rounded-pill" 
                                id="sendBtn"
                                disabled
                            >
                                Send
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class SupportClient {
            constructor() {
                this.socket = null;
                this.clientId = null;
                this.username = null;
                this.isConnected = false;

                // DOM elements
                this.loginSection = document.getElementById('loginSection');
                this.chatSection = document.getElementById('chatSection');
                this.usernameForm = document.getElementById('usernameForm');
                this.usernameInput = document.getElementById('usernameInput');
                this.chatMessages = document.getElementById('chatMessages');
                this.messageForm = document.getElementById('messageForm');
                this.messageInput = document.getElementById('messageInput');
                this.sendBtn = document.getElementById('sendBtn');
                this.connectionStatus = document.getElementById('connectionStatus');
                this.reconnectOption = document.getElementById('reconnectOption');
                this.reconnectBtn = document.getElementById('reconnectBtn');
                this.newChatBtn = document.getElementById('newChatBtn');

                this.setupEventListeners();
                this.checkForPreviousSession();
            }

            checkForPreviousSession() {
                const previousClientId = localStorage.getItem('support_client_id');
                if (previousClientId) {
                    // Show reconnect option
                    this.reconnectOption.style.display = 'block';
                    this.usernameForm.style.display = 'none';
                    
                    this.reconnectBtn.addEventListener('click', () => this.reconnectToSession(previousClientId));
                    this.newChatBtn.addEventListener('click', () => this.startNewChat());
                }
            }

            startNewChat() {
                localStorage.removeItem('support_client_id');
                this.reconnectOption.style.display = 'none';
                this.usernameForm.style.display = 'block';
                this.usernameInput.focus();
            }

            reconnectToSession(clientId) {
                console.log(`Attempting to reconnect to session ${clientId}`);
                this.clientId = clientId;
                // Directly show chat section and connect
                this.loginSection.style.display = 'none';
                this.chatSection.style.display = 'block';
                this.connectWebSocket();
            }

            setupEventListeners() {
                this.usernameForm.addEventListener('submit', (e) => this.handleJoin(e));
                this.messageForm.addEventListener('submit', (e) => this.handleSendMessage(e));
            }

            handleJoin(e) {
                e.preventDefault();
                this.username = this.usernameInput.value.trim();
                
                if (this.username) {
                    this.connectWebSocket();
                }
            }

            connectWebSocket() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const url = `${protocol}//${window.location.host}/ws/support/client/`;

                this.socket = new WebSocket(url);
                this.socket.onopen = () => this.onOpen();
                this.socket.onmessage = (event) => this.onMessage(event);
                this.socket.onclose = () => this.onClose();
                this.socket.onerror = (error) => this.onError(error);
            }

            onOpen() {
                console.log('Connected to support');
                this.isConnected = true;
                
                // Send join message only if this is a new session
                if (!this.clientId) {
                    this.socket.send(JSON.stringify({
                        type: 'client_join',
                        username: this.username,
                    }));
                } else {
                    // Reconnecting to existing session
                    console.log('Reconnected to existing session, notifying server');
                    this.socket.send(JSON.stringify({
                        type: 'client_reconnect',
                        client_id: this.clientId,
                    }));
                }

                // Show chat section
                this.loginSection.style.display = 'none';
                this.chatSection.style.display = 'block';
                this.updateConnectionStatus(true);
            }

            onMessage(event) {
                const data = JSON.parse(event.data);
                console.log('Message received from server:', data);

                switch (data.type) {
                    case 'connection_established':
                        this.clientId = data.client_id;
                        // Salva o client_id no localStorage para reconnect depois
                        localStorage.setItem('support_client_id', this.clientId);
                        this.displaySystemMessage(data.message);
                        // Carrega histórico anterior
                        this.loadMessageHistory();
                        break;
                    case 'chat_message':
                        console.log(`Chat message: ${data.username} (${data.sender_type}): ${data.message}`);
                        this.displayMessage(data.username, data.message, data.sender_type);
                        break;
                    default:
                        console.warn('Unknown message type:', data.type);
                }
            }

            async loadMessageHistory() {
                // Load previous messages from server
                try {
                    const response = await fetch(`/chat/api/support/chat/${this.clientId}/messages/`);
                    const data = await response.json();
                    
                    if (data.success) {
                        console.log(`Loaded ${data.messages.length} previous messages`);
                        // Clear chat (keep system messages)
                        const systemMessages = Array.from(this.chatMessages.querySelectorAll('.message-system'));
                        this.chatMessages.innerHTML = '';
                        systemMessages.forEach(msg => this.chatMessages.appendChild(msg));
                        
                        // Load old messages
                        data.messages.forEach(msg => {
                            if (msg.message_type === 'client') {
                                this.displayMessage(msg.username, msg.content, 'client');
                            } else {
                                this.displayMessage(msg.username, msg.content, 'admin');
                            }
                        });
                    }
                } catch (error) {
                    console.error('Error loading message history:', error);
                }
            }

            onClose() {
                console.log('Disconnected from support');
                this.isConnected = false;
                this.updateConnectionStatus(false);
                this.messageInput.disabled = true;
                this.sendBtn.disabled = true;
                this.displaySystemMessage('Connection lost.');
            }

            onError(error) {
                console.error('WebSocket error:', error);
                this.displaySystemMessage('Connection error occurred.');
            }

            handleSendMessage(e) {
                e.preventDefault();
                const message = this.messageInput.value.trim();

                if (message && this.isConnected && this.clientId) {
                    console.log(`Sending message: ${message}`);
                    this.socket.send(JSON.stringify({
                        type: 'client_message',
                        message: message,
                    }));

                    this.messageInput.value = '';
                    this.messageInput.focus();
                } else if (!this.isConnected) {
                    console.error('Not connected to server');
                } else if (!this.clientId) {
                    console.error('Client ID not set');
                }
            }

            displayMessage(username, content, senderType = 'client') {
                console.log(`Displaying message: ${username} (${senderType}): ${content}`);
                const messageEl = document.createElement('div');
                const isOwnMessage = senderType === 'client';
                messageEl.className = `message ${isOwnMessage ? 'message-user' : 'message-other'}`;

                messageEl.innerHTML = `
                    <div class="message-username">${this.escapeHtml(username)}</div>
                    <div>${this.escapeHtml(content)}</div>
                `;

                this.chatMessages.appendChild(messageEl);
                this.scrollToBottom();
            }

            displaySystemMessage(text) {
                const messageEl = document.createElement('div');
                messageEl.className = 'message message-system';
                messageEl.textContent = text;

                this.chatMessages.appendChild(messageEl);
                this.scrollToBottom();
            }

            scrollToBottom() {
                this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
            }

            updateConnectionStatus(isConnected) {
                if (isConnected) {
                    this.connectionStatus.textContent = 'Connected';
                    this.connectionStatus.classList.remove('bg-danger');
                    this.connectionStatus.classList.add('bg-success');
                    this.messageInput.disabled = false;
                    this.sendBtn.disabled = false;
                } else {
                    this.connectionStatus.textContent = 'Disconnected';
                    this.connectionStatus.classList.remove('bg-success');
                    this.connectionStatus.classList.add('bg-danger');
                }
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Initialize
        const client = new SupportClient();
    </script>
</body>
</html>
