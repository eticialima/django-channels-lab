{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Django Channels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Django Channels Chat</span>
            <div class="d-flex align-items-center gap-3">
                <span class="text-light"><small>Logged as: <strong>{{ display_name }}</strong></small></span>
                <span id="connectionStatus" class="badge bg-danger">Disconnected</span>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Chat Room: {{ room_name }}</h5>
                    </div>
                    
                    <div class="card-body">
                        <div id="chatMessages" class="chat-messages">
                            <!-- Messages will appear here -->
                        </div>
                    </div>

                    <div class="card-footer">
                        <form id="messageForm" class="d-flex gap-2">
                            <input 
                                type="text" 
                                id="messageInput" 
                                class="form-control" 
                                placeholder="Type your message..."
                                disabled
                            >
                            <button 
                                type="submit" 
                                class="btn btn-primary" 
                                id="sendBtn"
                                disabled
                            >
                                Send
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'js/chat.js' %}"></script>
    <script>
        const roomName = "{{ room_name }}";
        const displayName = "{{ display_name }}";
        const chat = new ChatWebSocket(roomName, displayName);
    </script>
</body>
</html>
