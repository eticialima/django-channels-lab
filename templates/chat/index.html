{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Channels Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Django Channels Chat</span>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Welcome to Chat</h3>
                        
                        <form id="usernameForm">
                            <div class="mb-3">
                                <label for="usernameInput" class="form-label">Enter your name:</label>
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="usernameInput" 
                                    placeholder="Your name"
                                    required
                                    autofocus
                                >
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                Join Chat
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('usernameForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value.trim();
            
            if (username) {
                // Format username to URL-friendly slug
                const roomName = username
                    .toLowerCase()
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '') // Remove accents
                    .replace(/[^\w\s-]/g, '') // Remove special chars
                    .replace(/\s+/g, '-') // Replace spaces with hyphens
                    .replace(/-+/g, '-') // Replace multiple hyphens
                    .replace(/^-+|-+$/g, ''); // Remove leading/trailing hyphens
                
                // Redirect to chat room with formatted room name
                window.location.href = `/room/${roomName}/`;
            }
        });
    </script>
</body>
</html>
